[package]
name = "honey_badger"
version = "2.0.0"
edition = "2021"
authors = ["nickhrm"]
description = "A competitive Battlesnake: iterative-deepening paranoid alpha-beta search with tail-aware Voronoi evaluation"
license = "MIT"
default-run = "honey_badger"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
